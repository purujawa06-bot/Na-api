name: Fix lockfile (sekali pakai)

on:
  push:
    paths:
      - '.github/workflows/fix-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-lock:
    name: Sinkronkan package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sinkronkan lockfile
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Commit & push jika berubah
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "lockfile sudah sinkron, tidak ada perubahan"
          else
            git commit -m "chore: sinkronkan package-lock.json (npm install --package-lock-only)"
            git push
          fi
