name: Security

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'legacy/**'
      - 'public/**'
      - 'scripts/**'
      - 'utils/**'
      - 'backend/**'
      - '*.js'
      - '*.jsx'
      - '*.mjs'
      - '*.ts'
      - '*.tsx'
      - '*.json'
      - '*.css'
      - 'next.config.*'
      - 'tailwind.config.*'
      - 'postcss.config.*'
      - 'jsconfig.json'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'
      - '.gitleaks.toml'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1" # tiap Senin
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: --no-deprecation
jobs:
  audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install deps (npm ci)
        run: npm ci --ignore-scripts --silent
      - name: npm audit high/critical (advisory, non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true

  gitleaks:
    name: Gitleaks (cegah secret bocor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
