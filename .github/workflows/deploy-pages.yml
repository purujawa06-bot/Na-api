name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'legacy/**'
      - 'public/**'
      - 'scripts/**'
      - 'utils/**'
      - '*.js'
      - '*.jsx'
      - '*.mjs'
      - '*.ts'
      - '*.tsx'
      - '*.json'
      - '*.css'
      - 'next.config.*'
      - 'tailwind.config.*'
      - 'postcss.config.*'
      - 'jsconfig.json'
      - 'tsconfig*.json'
      - '.eslintrc*'
      - 'instrumentation.*'
      - 'middleware.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NODE_OPTIONS: --no-deprecation
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --silent
      - name: Build (static export)
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: ''
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5