name: Build puruLocal Bot APK (experiment)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional tag to create/update GitHub Release (e.g. purulocal-v0.1.0)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'purulocal-bot/**'
      - '.github/workflows/build-purulocal-apk.yml'

permissions:
  contents: write

concurrency:
  group: purulocal-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: purulocal-bot/flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Install Android tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip

      - name: Ensure Flutter Android project scaffold
        run: |
          if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            rm -rf android
            flutter create --platforms=android --org com.puruboy --project-name purulocal_bot .
          fi
          mkdir -p assets
          if [ -f "../assets/favicon.ico" ]; then cp ../assets/favicon.ico assets/icon.ico; fi
          if [ -f "../assets/favicon.jpg" ]; then cp ../assets/favicon.jpg assets/icon.jpg; fi

      - name: Apply Android overlay (permissions, backend autostart)
        run: |
          if [ -d "android_overlay" ]; then
            cp -R android_overlay/. .
          fi

      - name: Enable legacy JNI lib packaging (extract native libs)
        run: |
          python3 - <<'PY'
          import pathlib, re
          for p in [pathlib.Path('android/app/build.gradle'), pathlib.Path('android/app/build.gradle.kts')]:
            if not p.exists():
              continue
            s = p.read_text()
            if 'useLegacyPackaging' in s:
              continue
            block_groovy = "\n    packagingOptions {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }\n"
            block_kts = "\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }\n"
            m = re.search(r'\nandroid\s*\{', s)
            if not m:
              raise SystemExit(f'android block not found in {p}')
            i = m.end()
            # insert before closing brace of android block (approx: last closing brace in file is often build end, so find matching)
            depth = 1
            j = i
            while j < len(s) and depth > 0:
              if s[j] == '{': depth += 1
              elif s[j] == '}': depth -= 1
              j += 1
            if depth != 0:
              raise SystemExit(f'could not match android block in {p}')
            insert = block_kts if p.suffix == '.kts' else block_groovy
            s = s[:j-1] + insert + s[j-1:]
            p.write_text(s)
            print(f'patched {p}')
          PY

      - name: Configure production signing (from secrets)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 not set; building without production signing config (release may be debug-signed)."
            exit 0
          fi
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=release-keystore.jks
          EOF
          python3 - <<'PY'
          import pathlib, re
          for p in [pathlib.Path('android/app/build.gradle'), pathlib.Path('android/app/build.gradle.kts')]:
            if not p.exists():
              continue
            s = p.read_text()
            if 'key.properties' in s and 'signingConfigs' in s:
              print(f'signing already configured in {p}')
              continue
            if p.suffix == '.kts':
              pre = '''
import java.util.Properties
import java.io.FileInputStream

val keystoreProperties = Properties()
val keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(FileInputStream(keystorePropertiesFile))
}
'''
              sc = '''
    signingConfigs {
        create("release") {
            keyAlias = keystoreProperties["keyAlias"] as String?
            keyPassword = keystoreProperties["keyPassword"] as String?
            storeFile = keystoreProperties["storeFile"]?.let { file(it as String) }
            storePassword = keystoreProperties["storePassword"] as String?
        }
    }
'''
              if 'import java.util.Properties' not in s:
                s = pre + s
              # insert signingConfigs inside android block
              m = re.search(r'\nandroid\s*\{', s)
              if m:
                s = s[:m.end()] + sc + s[m.end():]
              # set release buildType signingConfig
              s = re.sub(r'(buildTypes\s*\{[\s\S]*?release\s*\{)', r'\1\n            signingConfig = signingConfigs.getByName("release")', s, count=1)
            else:
              pre = '''
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
'''
              sc = '''
    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }
'''
              if "def keystoreProperties" not in s:
                s = pre + s
              m = re.search(r'\nandroid\s*\{', s)
              if m:
                s = s[:m.end()] + sc + s[m.end():]
              # replace debug signing in release with release signingConfig, or add it
              if re.search(r'buildTypes\s*\{[\s\S]*?release\s*\{[\s\S]*?signingConfig\s+signingConfigs\.\w+', s):
                s = re.sub(r'(buildTypes\s*\{[\s\S]*?release\s*\{[\s\S]*?)signingConfig\s+signingConfigs\.\w+', r'\1signingConfig signingConfigs.release', s, count=1)
              else:
                s = re.sub(r'(buildTypes\s*\{[\s\S]*?release\s*\{)', r'\1\n            signingConfig signingConfigs.release', s, count=1)
            p.write_text(s)
            print(f'patched release signing in {p}')
          PY
          echo "Production signing configured."

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Go backend (host check)
        working-directory: purulocal-bot/go_backend
        run: |
          go mod tidy
          go build ./...

      - name: Build Go backend for Android (arm64, bundled in APK)
        working-directory: purulocal-bot/go_backend
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../flutter_app/android/app/src/main/jniLibs/arm64-v8a
          go build -trimpath -ldflags="-s -w" -o ../flutter_app/android/app/src/main/jniLibs/arm64-v8a/libpurulocal.so ./cmd/purulocal

      - name: Build APK (release)
        run: flutter build apk --release --build-number=${{ github.run_number }} --build-name=0.1.${{ github.run_number }}

      - name: Compute checksum and manifest
        working-directory: purulocal-bot/flutter_app/build/app/outputs/flutter-apk
        run: |
          sha256sum app-release.apk > app-release.apk.sha256
          cat app-release.apk.sha256
          HASH=$(awk '{print $1}' app-release.apk.sha256)
          cat > update-manifest.json <<EOF
          {
            "app": "puruLocalBot",
            "versionName": "0.1.${{ github.run_number }}",
            "buildNumber": ${{ github.run_number }},
            "minBuild": 1,
            "apkUrl": "https://github.com/purujawa06-bot/Na-api/releases/download/purulocal-experiment/app-release.apk",
            "sha256": "${HASH}",
            "force": false,
            "changelog": "Auto-update build #${{ github.run_number }} (commit ${{ github.sha }})"
          }
          EOF
          echo "---manifest---"
          cat update-manifest.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: puruLocalBot-apk
          path: |
            purulocal-bot/flutter_app/build/app/outputs/flutter-apk/app-release.apk
            purulocal-bot/flutter_app/build/app/outputs/flutter-apk/app-release.apk.sha256
            purulocal-bot/flutter_app/build/app/outputs/flutter-apk/update-manifest.json

      - name: Publish rolling experiment release (APK + manifest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: purulocal-experiment
          name: puruLocal Bot (experiment)
          body: "Rolling experiment build APK puruLocal Bot. Sesi bot berjalan lokal di perangkat."
          draft: false
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            purulocal-bot/flutter_app/build/app/outputs/flutter-apk/app-release.apk
            purulocal-bot/flutter_app/build/app/outputs/flutter-apk/app-release.apk.sha256
            purulocal-bot/flutter_app/build/app/outputs/flutter-apk/update-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}