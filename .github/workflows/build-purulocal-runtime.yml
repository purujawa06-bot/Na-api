name: Build puruLocal Runtime (.so)
# Update UI/fitur/backend runtime tanpa membangun/memperbarui APK.
# APK hanya untuk perubahan arsitektur/shell (lihat workflow build-purulocal-apk).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-purulocal-runtime.yml'
      - 'purulocal-bot/go_backend/**'
      - 'purulocal-bot/ui/**'

permissions:
  contents: write

concurrency:
  group: purulocal-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Build UI (embed) if present
        working-directory: purulocal-bot/ui
        run: |
          if [ -f package.json ]; then
            npm ci 2>/dev/null || npm install
            npm run build
            rm -rf ../go_backend/internal/web/static/*
            cp -R dist/* ../go_backend/internal/web/static/
          fi

      - name: Build Go backend (host check)
        working-directory: purulocal-bot/go_backend
        run: |
          go mod tidy
          go build ./...

      - name: Build Go backend runtimes (android arm64 + linux amd64/arm64)
        working-directory: purulocal-bot/go_backend
        run: |
          set -e
          mkdir -p ../runtime-out
          # Android arm64 (launcher/runtime Android)
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../runtime-out/libpurulocal-arm64-v8a.so ./cmd/purulocal
          # Linux amd64/arm64 (cloud/server, dipakai runner export)
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../runtime-out/purulocal-bot-linux-amd64 ./cmd/purulocal
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../runtime-out/purulocal-bot-linux-arm64 ./cmd/purulocal
          # Runner (index.js) untuk cloud/export auto-update
          chmod +x ../runtime-out/purulocal-bot-linux-amd64
          ../runtime-out/purulocal-bot-linux-amd64 -emit-runner > ../runtime-out/purulocal-runner.js
          ls -lh ../runtime-out/

      - name: Prepare runtime manifest
        working-directory: purulocal-bot/runtime-out
        run: |
          sha256sum libpurulocal-arm64-v8a.so purulocal-bot-linux-amd64 purulocal-bot-linux-arm64 purulocal-runner.js > checksums.sha256
          cat checksums.sha256
          export HASH_ANDROID_ARM64=$(awk '$2=="libpurulocal-arm64-v8a.so"{print $1}' checksums.sha256)
          export HASH_LINUX_AMD64=$(awk '$2=="purulocal-bot-linux-amd64"{print $1}' checksums.sha256)
          export HASH_LINUX_ARM64=$(awk '$2=="purulocal-bot-linux-arm64"{print $1}' checksums.sha256)
          export HASH_RUNNER=$(awk '$2=="purulocal-runner.js"{print $1}' checksums.sha256)
          curl -fsSL "https://github.com/purujawa06-bot/Na-api/releases/download/purulocal-experiment/update-manifest.json" -o prev-manifest.json || echo '{}' > prev-manifest.json
          python3 - <<'PY'
          import hashlib, json, os
          CHUNK_SIZE = 262144  # 256KB - delta update per chunk

          def chunk_meta(path):
            h = hashlib.sha256()
            chunks = []
            size = 0
            with open(path, 'rb') as f:
              while True:
                b = f.read(CHUNK_SIZE)
                if not b:
                  break
                size += len(b)
                h.update(b)
                chunks.append(hashlib.sha256(b).hexdigest())
            return {"size": size, "sha256": h.hexdigest(), "chunkSize": CHUNK_SIZE, "chunkHashes": chunks}

          run = int(os.environ.get('GITHUB_RUN_NUMBER', '0') or '0')
          sha_env = os.environ.get('GITHUB_SHA','')
          hashes = {
            "arm64-v8a": os.environ.get('HASH_ANDROID_ARM64',''),
            "linux-amd64": os.environ.get('HASH_LINUX_AMD64',''),
            "linux-arm64": os.environ.get('HASH_LINUX_ARM64',''),
          }
          runner_hash = os.environ.get('HASH_RUNNER','')
          base = "https://github.com/purujawa06-bot/Na-api/releases/download/purulocal-experiment/"
          files = {
            "arm64-v8a": "libpurulocal-arm64-v8a.so",
            "linux-amd64": "purulocal-bot-linux-amd64",
            "linux-arm64": "purulocal-bot-linux-arm64",
          }
          prev = {}
          try:
            with open('prev-manifest.json','r',encoding='utf-8') as f:
              prev = json.load(f) or {}
          except Exception:
            prev = {}
          prev_rv = int(prev.get('runtimeVersion') or 0)
          runtime_version = max(run, prev_rv + 1)
          m = dict(prev) if isinstance(prev, dict) else {}
          rt = dict(m.get('runtime') or {})
          for k, fn in files.items():
            meta = chunk_meta(fn)
            rt[k] = {
              "url": base + fn,
              "sha256": hashes.get(k, "") or meta["sha256"],
              "size": meta["size"],
              "chunkSize": meta["chunkSize"],
              "chunkHashes": meta["chunkHashes"],
            }
          prev_runner = (m.get('runner') or {}) if isinstance(m.get('runner'), dict) else {}
          runner_meta = chunk_meta('purulocal-runner.js')
          runner_changed = (runner_hash and runner_hash != (prev_runner.get('sha256') or ''))
          m.update({
            "app": "puruLocalBot",
            "runtimeVersion": runtime_version,
            "runtime": rt,
            "runner": {
              "url": base + "purulocal-runner.js",
              "sha256": runner_hash or runner_meta["sha256"],
              "size": runner_meta["size"],
              "chunkSize": runner_meta["chunkSize"],
              "chunkHashes": runner_meta["chunkHashes"],
              "version": runtime_version,
              "important": bool(runner_changed)
            },
            "force": False,
            "changelog": f"Runtime update (UI/fitur) #{runtime_version} (commit {sha_env})"
          })
          m.setdefault("versionName", prev.get("versionName","0.1.0"))
          m.setdefault("buildNumber", int(prev.get("buildNumber") or 1))
          m.setdefault("minBuild", int(prev.get("minBuild") or 1))
          m.setdefault("minShellBuild", int(prev.get("minShellBuild") or m.get("buildNumber") or 1))
          m.setdefault("apkUrl", prev.get("apkUrl","https://github.com/purujawa06-bot/Na-api/releases/download/purulocal-experiment/app-release.apk"))
          m.setdefault("sha256", prev.get("sha256",""))
          with open('update-manifest.json','w',encoding='utf-8') as f:
            json.dump(m, f, indent=2)
            f.write('\n')
          print(json.dumps(m, indent=2))
          PY

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: puruLocal-runtime
          path: |
            purulocal-bot/runtime-out/libpurulocal-arm64-v8a.so
            purulocal-bot/runtime-out/libpurulocal-arm64-v8a.so.sha256
            purulocal-bot/runtime-out/purulocal-bot-linux-amd64
            purulocal-bot/runtime-out/purulocal-bot-linux-arm64
            purulocal-bot/runtime-out/purulocal-runner.js
            purulocal-bot/runtime-out/checksums.sha256
            purulocal-bot/runtime-out/update-manifest.json

      - name: Publish rolling runtime release (no APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: purulocal-experiment
          name: puruLocal Bot (experiment)
          body: "Rolling runtime puruLocal Bot (backend+UI+runner). Diunduh otomatis oleh launcher/runner tanpa update APK."
          draft: false
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            purulocal-bot/runtime-out/libpurulocal-arm64-v8a.so
            purulocal-bot/runtime-out/libpurulocal-arm64-v8a.so.sha256
            purulocal-bot/runtime-out/purulocal-bot-linux-amd64
            purulocal-bot/runtime-out/purulocal-bot-linux-arm64
            purulocal-bot/runtime-out/purulocal-runner.js
            purulocal-bot/runtime-out/checksums.sha256
            purulocal-bot/runtime-out/update-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
