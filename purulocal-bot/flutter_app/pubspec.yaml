name: purulocal_bot
description: puruLocal Bot - WhatsApp bot lokal (whatsmeow) dengan auto-update.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  dio: ^5.4.0
  package_info_plus: ^8.0.0
  path_provider: ^2.1.0
  crypto: ^3.0.3
  qr_flutter: ^4.1.0
  url_launcher: ^6.2.0
  permission_handler: ^11.3.0
  open_filex: ^4.4.0
  webview_flutter: ^4.10.0
  android_intent_plus: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.ico
    - assets/icon.jpg
