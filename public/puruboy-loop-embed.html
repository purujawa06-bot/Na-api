<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PuruBoy API — Loop Embed</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif}
.embed{width:600px;max-width:100vw;height:220px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:18px;background:#05070f;border:1px solid rgba(255,255,255,.08);border-radius:20px;position:relative;overflow:hidden}
#bg{position:absolute;inset:0;pointer-events:none}
.mark{position:relative;width:110px;height:110px;flex-shrink:0;display:flex;align-items:center;justify-content:center;z-index:2}
.ring{position:absolute;inset:0}
.core{width:74px;height:74px;border-radius:22px;background:linear-gradient(135deg,#22d3ee,#a78bfa,#f472b6);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:32px;color:#04060f;will-change:transform}
.dot{position:absolute;width:8px;height:8px;border-radius:50%;background:#22d3ee}
.txt{z-index:2;will-change:transform,opacity}
.brand{font-size:42px;font-weight:900;letter-spacing:-1px;color:#fff;line-height:1;display:flex}
.brand span{display:inline-block;will-change:transform,opacity}
.brand .hl{background:linear-gradient(90deg,#22d3ee,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:8px;font-size:12px;letter-spacing:3px;color:#7d8590;font-weight:700;display:flex;align-items:center;gap:8px}
.live{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px #22c55e}
.bar{margin-top:10px;width:260px;max-width:40vw;height:4px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.fill{width:40%;height:100%;background:linear-gradient(90deg,#22d3ee,#a78bfa);border-radius:99px;will-change:transform}
</style>
</head>
<body>
<div class="embed" id="embed">
<svg id="bg" viewBox="0 0 600 220" preserveAspectRatio="none"><circle cx="80" cy="40" r="120" fill="#22d3ee" opacity=".06"/><circle cx="540" cy="190" r="140" fill="#a78bfa" opacity=".07"/></svg>
<div class="mark">
<svg class="ring" viewBox="0 0 110 110"><circle id="orbit" cx="55" cy="55" r="48" fill="none" stroke="rgba(34,211,238,.4)" stroke-width="2" stroke-dasharray="12 10" stroke-linecap="round"/></svg>
<div class="core" id="core">P</div>
<div class="dot" style="top:6px;left:50%"></div>
<div class="dot" style="bottom:8px;left:12px;background:#a78bfa"></div>
<div class="dot" style="bottom:8px;right:12px;background:#f472b6"></div>
</div>
<div class="txt" id="txt">
<div class="brand" id="brand"></div>
<div class="sub"><span class="live" id="live"></span><span>FREE REST API • ONLINE</span></div>
<div class="bar"><div class="fill" id="fill"></div></div>
</div>
</div>
<script>
const word1='PuruBoy', word2='API';
const brand=document.getElementById('brand');
[...word1].forEach(c=>{const s=document.createElement('span');s.textContent=c;brand.appendChild(s)});
const sp=document.createElement('span');sp.innerHTML='&nbsp;';brand.appendChild(sp);
[...word2].forEach(c=>{const s=document.createElement('span');s.textContent=c;s.classList.add('hl');brand.appendChild(s)});

// infinite rotate ring
anime({targets:'#orbit',rotate:'1turn',duration:6000,loop:true,easing:'linear'});
// pulse core
anime({targets:'#core',scale:[1,1.08,1],duration:1600,loop:true,easing:'easeInOutSine'});
// dots stagger pulse loop
anime({targets:'.dot',scale:[1,1.8,1],opacity:[1,.5,1],delay:anime.stagger(250),duration:1200,loop:true,easing:'easeInOutSine'});
// live blink
anime({targets:'#live',opacity:[1,.2,1],duration:900,loop:true,easing:'linear'});
// scan bar loop
anime({targets:'#fill',translateX:[ -20, 260 ],duration:1800,loop:true,easing:'easeInOutSine',direction:'alternate'});
// main text loop timeline
anime.timeline({loop:true})
.add({targets:'#brand span',translateY:[40,0],opacity:[0,1],delay:anime.stagger(45),duration:600,easing:'easeOutExpo'})
.add({targets:'#txt .sub',opacity:[0,1],translateX:[-12,0],duration:500,easing:'easeOutQuad'},'-=300')
.add({targets:'#txt .bar',opacity:[0,1],scaleX:[0,1],duration:500,easing:'easeOutQuad'},'-=400')
.add({targets:'#embed',duration:2200}) // hold
.add({targets:['#brand span','#txt .sub','#txt .bar'],opacity:0,translateY:-14,delay:anime.stagger(20),duration:400,easing:'easeInQuad'});
</script>
</body>
</html>
